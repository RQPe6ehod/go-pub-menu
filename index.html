<style>
  :root{
    --bg: #142720;
    --bg-deep: #0E1D17;
    --panel: #1C3628;
    --line: #2C4A3A;
    --gold: #C79A46;
    --gold-soft: #8E7538;
    --cream: #F3EEDF;
    --cream-dim: #C9CFC1;
    --muted: #8FA08D;
    --shadow: rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(199,154,70,0.07), transparent 45%),
                       radial-gradient(circle at 100% 30%, rgba(199,154,70,0.05), transparent 40%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  ::selection{ background: var(--gold); color: var(--bg-deep); }

  /* ---------- Header ---------- */
  header.top{
    position: sticky; top:0; z-index: 30;
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
    padding: 18px 20px 0;
  }
  .brand-row{
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    margin-bottom: 14px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:40px; height:40px; border-radius:50%;
    border: 1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:700; font-size:15px; color: var(--gold);
    letter-spacing: 0.5px;
  }
  .brand-text{ line-height:1.05; }
  .brand-text .name{ font-family:'Fraunces', serif; font-weight:600; font-size: 20px; color: var(--cream); }
  .brand-text .sub{ font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .svc-note{ font-size: 10.5px; color: var(--muted); text-align:right; line-height:1.3; max-width: 110px; }

  .mode-switch{
    display:flex; background: var(--bg-deep); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px; gap:3px; margin-bottom: 14px;
  }
  .mode-switch button{
    flex:1; border:none; background:transparent; color: var(--muted);
    font-family:'Fraunces', serif; font-size: 15px; font-weight: 600;
    padding: 9px 0; border-radius: 999px; cursor:pointer;
    transition: background .25s ease, color .25s ease;
  }
  .mode-switch button.active{ background: var(--gold); color: var(--bg-deep); }

  .search-wrap{ position:relative; margin-bottom: 12px; }
  .search-wrap input{
    width:100%; background: var(--bg-deep); border: 1px solid var(--line);
    color: var(--cream); padding: 10px 14px 10px 34px; border-radius: 10px;
    font-family:'Inter',sans-serif; font-size: 14px; outline: none;
  }
  .search-wrap input::placeholder{ color: var(--muted); }
  .search-wrap input:focus{ border-color: var(--gold-soft); }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.55; }

  nav.chips{
    display:flex; gap:8px; overflow-x:auto; padding-bottom: 12px;
    scrollbar-width:none;
  }
  nav.chips::-webkit-scrollbar{ display:none; }
  nav.chips button{
    flex: 0 0 auto; white-space:nowrap;
    background: var(--panel); border: 1px solid var(--line); color: var(--cream-dim);
    font-family:'Inter',sans-serif; font-size: 12.5px; font-weight:500;
    padding: 7px 13px; border-radius: 999px; cursor:pointer;
  }
  nav.chips button.active{ background: var(--gold); border-color: var(--gold); color: var(--bg-deep); font-weight:600; }

  /* ---------- Content ---------- */
  main{ padding: 22px 20px 0; max-width: 640px; margin: 0 auto; }

  section.category{ margin-bottom: 34px; scroll-margin-top: 168px; }
  .cat-head{ display:flex; align-items:baseline; gap:10px; margin-bottom: 4px; }
  .cat-head h2{
    font-family:'Fraunces', serif; font-weight:600; font-size: 23px; margin:0;
    color: var(--gold);
  }
  .cat-head .rule{ flex:1; height:1px; background: var(--line); }
  .cat-note{ font-size: 12px; color: var(--muted); margin: 0 0 14px; }

  .item{ padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child{ border-bottom:none; }
  .item-row{ display:flex; align-items:baseline; gap:8px; }
  .item-num{ color: var(--gold-soft); font-size: 12px; font-weight:600; min-width: 15px; flex-shrink:0; }
  .item-name{ font-size: 15.5px; font-weight:500; color: var(--cream); }
  .dots{ flex:1; border-bottom: 1.5px dotted var(--line); transform: translateY(-3px); min-width: 14px; }
  .item-price{ font-family:'Fraunces', serif; font-weight:600; font-size: 15px; color: var(--cream); white-space:nowrap; flex-shrink:0; }
  .item-price small{ font-size:11px; font-weight:400; color: var(--muted); }
  .item-desc{ font-size: 12.5px; color: var(--muted); margin-top: 3px; padding-left: 23px; line-height:1.4; }

  .empty-state{ text-align:center; color: var(--muted); font-size: 14px; padding: 60px 20px; }

  footer.foot{
    text-align:center; color: var(--muted); font-size: 12px; margin-top: 30px; padding: 0 20px;
    line-height: 1.6;
  }
  footer.foot .gold{ color: var(--gold); font-family:'Fraunces', serif; font-size:15px; }

  @media (min-width: 720px){
    header.top{ padding-left: calc(50% - 320px); padding-right: calc(50% - 320px); }
  }
</style>
</head>

let currentMode = 'food';

function fmtPrice(item){
  let parts = [item.price];
  if(item.price2) parts.push(item.price2);
  if(item.price3) parts.push(item.price3);
  return parts.join(' / ') + ' тг.';
}

  MENU[currentMode].forEach((cat, i) => {
    const b = document.createElement('button');
    b.textContent = cat.title;
    b.dataset.idx = i;
    b.onclick = () => {
      document.getElementById('cat-' + i).scrollIntoView({behavior:'smooth', block:'start'});
    };
    chips.appendChild(b);
  });
}

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const cats = MENU[currentMode];
  cats.forEach((cat, i) => {
    const sec = document.createElement('section');
    sec.className = 'category';
    sec.id = 'cat-' + i;

    let html = `<div class="cat-head"><h2>${cat.title}</h2><div class="rule"></div></div>`;
    if(cat.note) html += `<p class="cat-note">${cat.note}</p>`;
    cat.items.forEach(it => {
      html += `<div class="item" data-search="${(it.name + ' ' + (it.desc||'')).toLowerCase()}">
        <div class="item-row">
          ${it.n ? `<span class="item-num">${it.n}</span>` : ''}
          <span class="item-name">${it.name}</span>
          <span class="dots"></span>
          <span class="item-price">${fmtPrice(it)}</span>
        </div>
        ${it.desc ? `<div class="item-desc">${it.desc}</div>` : ''}
      </div>`;
    });
    sec.innerHTML = html;
    main.appendChild(sec);
  });
}

function setMode(mode){
  currentMode = mode;
  document.getElementById('btn-food').classList.toggle('active', mode==='food');
  document.getElementById('btn-bar').classList.toggle('active', mode==='bar');
  document.getElementById('search').value = '';
  renderChips();
  renderMain();
  window.scrollTo({top:0, behavior:'instant'});
  setupObserver();
}

function onSearch(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('section.category').forEach(sec => {
    let visibleCount = 0;
    sec.querySelectorAll('.item').forEach(item => {
      const match = !q || item.dataset.search.includes(q);
      item.style.display = match ? '' : 'none';
      if(match) visibleCount++;
    });
    sec.style.display = visibleCount ? '' : 'none';
  });
}

let observer;
function setupObserver(){
  if(observer) observer.disconnect();
  const chips = document.getElementById('chips').children;
  observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const idx = entry.target.id.split('-')[1];
        Array.from(chips).forEach(c => c.classList.remove('active'));
        if(chips[idx]){
          chips[idx].classList.add('active');
          chips[idx].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
        }
      }
    });
  }, { rootMargin: '-160px 0px -70% 0px' });
  document.querySelectorAll('section.category').forEach(sec => observer.observe(sec));
}

renderChips();
renderMain();
setupObserver();
</script>
</body>
</html>
