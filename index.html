<!DOCTYPE html>
<html lang="ru" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover">
<title>GO pub — Меню</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #142720;
    --bg-deep: #0E1D17;
    --panel: #1C3628;
    --line: #2C4A3A;
    --gold: #C79A46;
    --gold-soft: #8E7538;
    --cream: #F3EEDF;
    --cream-dim: #C9CFC1;
    --muted: #8FA08D;
    --shadow: rgba(0,0,0,.35);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color: transparent;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    background-image: radial-gradient(circle at 15% 0%, rgba(199,154,70,0.07), transparent 45%),
                       radial-gradient(circle at 100% 30%, rgba(199,154,70,0.05), transparent 40%);
    color: var(--cream);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    padding-bottom: 48px;
  }
  ::selection{ background: var(--gold); color: var(--bg-deep); }

  header.top{
    position: sticky; top:0; z-index: 30;
    background: linear-gradient(180deg, var(--bg-deep) 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--line);
    padding: 14px 20px 0;
  }

  .lang-switch-wrap{ display:flex; justify-content:space-between; align-items:center; position:relative; margin-bottom: 8px; gap:10px; }
  .lang-btn{
    display:flex; align-items:center; gap:6px;
    background: var(--panel); border: 1px solid var(--line); color: var(--cream-dim);
    padding: 6px 14px; border-radius: 999px; font-size: 12.5px; font-weight:600; cursor:pointer;
  }
  .lang-btn svg{ opacity:.85; }
  .lang-menu{
    display:none; position:absolute; top: 36px; z-index:40;
    background: var(--panel); border:1px solid var(--line); border-radius: 12px;
    overflow:hidden; box-shadow: 0 10px 30px var(--shadow);
    min-width: 150px;
  }
  .lang-menu.open{ display:block; }
  .lang-menu button{
    display:block; width:100%; text-align:left; padding: 10px 16px;
    background:transparent; border:none; color: var(--cream); font-size: 13.5px; cursor:pointer;
  }
  .lang-menu button:hover, .lang-menu button.active{ background: rgba(199,154,70,0.15); color: var(--gold); }
  .lang-menu button + button{ border-top: 1px solid var(--line); }

  .credit-link{
    display:inline-flex; align-items:center; gap: 4px;
    color: var(--gold); text-decoration:none; font-weight:600;
    font-size: 10.5px; letter-spacing:.03em; margin-bottom: 10px;
  }
  .credit-link:hover{ text-decoration:underline; }
  .credit-icon{ flex-shrink:0; opacity:.9; }

  .top-right-actions{
    display:flex; align-items:center; justify-content:flex-end; gap: 10px;
    margin-bottom: 8px;
  }
  .review-link{
    display:inline-flex; align-items:center; gap: 6px;
    background: linear-gradient(135deg, rgba(199,154,70,0.2), rgba(199,154,70,0.1));
    border: 1.5px solid var(--gold);
    color: var(--gold);
    text-decoration:none;
    font-weight:700;
    font-size: 12.5px;
    padding: 7px 14px;
    border-radius: 999px;
    box-shadow: 0 3px 12px rgba(199,154,70,0.18);
    transition: background .2s ease, transform .15s ease;
    white-space: nowrap;
  }
  .review-link:hover, .review-link:active{
    background: rgba(199,154,70,0.3);
    transform: translateY(-1px);
  }
  .review-link svg{ flex-shrink:0; }

  .brand-row{
    display:flex; align-items:center; justify-content:space-between; gap: 12px;
    margin-bottom: 14px;
  }
  .brand{
    display:flex; align-items:center; gap:10px;
  }
  .brand-mark{
    width:40px; height:40px; border-radius:50%;
    border: 1.5px solid var(--gold);
    display:flex; align-items:center; justify-content:center;
    font-family:'Fraunces', serif; font-weight:700; font-size:15px; color: var(--gold);
    letter-spacing: 0.5px;
  }
  .brand-text{ line-height:1.05; }
  .brand-text .name{ font-family:'Fraunces', serif; font-weight:600; font-size: 20px; color: var(--cream); }
  .brand-text .sub{ font-size: 11px; color: var(--muted); letter-spacing: .06em; }
  .svc-note{ font-size: 10.5px; color: var(--muted); text-align:right; line-height:1.3; max-width: 130px; }

  .mode-switch{
    display:flex; background: var(--bg-deep); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px; gap:3px; margin-bottom: 14px;
  }
  .mode-switch button{
    flex:1; border:none; background:transparent; color: var(--muted);
    font-family:'Fraunces', serif; font-size: 15px; font-weight: 600;
    padding: 9px 0; border-radius: 999px; cursor:pointer;
    transition: background .25s ease, color .25s ease;
  }
  .mode-switch button.active{ background: var(--gold); color: var(--bg-deep); }

  .search-wrap{ position:relative; margin-bottom: 12px; }
  .search-wrap input{
    width:100%; background: var(--bg-deep); border: 1px solid var(--line);
    color: var(--cream); padding: 10px 14px 10px 34px; border-radius: 10px;
    font-family:'Inter',sans-serif; font-size: 14px; outline: none;
  }
  .search-wrap input::placeholder{ color: var(--muted); }
  .search-wrap input:focus{ border-color: var(--gold-soft); }
  .search-wrap svg{ position:absolute; left:11px; top:50%; transform:translateY(-50%); opacity:.55; }

  nav.chips{
    display:flex; gap:8px; overflow-x:auto; padding-bottom: 12px;
    scrollbar-width:none;
  }
  nav.chips::-webkit-scrollbar{ display:none; }
  nav.chips button{
    flex: 0 0 auto; white-space:nowrap;
    background: var(--panel); border: 1px solid var(--line); color: var(--cream-dim);
    font-family:'Inter',sans-serif; font-size: 12.5px; font-weight:500;
    padding: 7px 13px; border-radius: 999px; cursor:pointer;
  }
  nav.chips button.active{ background: var(--gold); border-color: var(--gold); color: var(--bg-deep); font-weight:600; }

  main{ padding: 22px 20px 0; max-width: 640px; margin: 0 auto; }

  section.category{ margin-bottom: 34px; scroll-margin-top: 208px; }
  .cat-head{ display:flex; align-items:baseline; gap:10px; margin-bottom: 4px; }
  .cat-head h2{
    font-family:'Fraunces', serif; font-weight:600; font-size: 23px; margin:0;
    color: var(--gold);
  }
  .cat-head .rule{ flex:1; height:1px; background: var(--line); }
  .cat-note{ font-size: 12px; color: var(--muted); margin: 0 0 14px; }

  .item{ padding: 12px 0; border-bottom: 1px solid var(--line); }
  .item:last-child{ border-bottom:none; }
  .item-row{ display:flex; align-items:baseline; gap:8px; }
  .item-num{ color: var(--gold-soft); font-size: 12px; font-weight:600; min-width: 15px; flex-shrink:0; }
  .item-name{ font-size: 15.5px; font-weight:500; color: var(--cream); }
  .dots{ flex:1; border-bottom: 1.5px dotted var(--line); transform: translateY(-3px); min-width: 14px; }
  .item-price{ font-family:'Fraunces', serif; font-weight:600; font-size: 15px; color: var(--cream); white-space:nowrap; flex-shrink:0; }
  .item-price small{ font-size:11px; font-weight:400; color: var(--muted); }
  .item.disabled{ opacity:.5; }
  .item.disabled .item-name{ text-decoration: line-through; }
  .unavail-tag{ font-size: 10px; color: var(--gold); border:1px solid var(--gold); border-radius:999px; padding: 1px 7px; margin-left: 8px; vertical-align: middle; }
  .item-desc{ font-size: 12.5px; color: var(--muted); margin-top: 3px; padding-left: 23px; line-height:1.4; }

  .empty-state{ text-align:center; color: var(--muted); font-size: 14px; padding: 60px 20px; }

  footer.foot{
    text-align:center; color: var(--muted); font-size: 12px; margin-top: 30px; padding: 0 20px;
    line-height: 1.6;
  }
  footer.foot .gold{ color: var(--gold); font-family:'Fraunces', serif; font-size:15px; }

  .call-bar{
    position: fixed; left:0; right:0; bottom:0; z-index: 60;
    display:flex; gap:10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: linear-gradient(0deg, var(--bg-deep) 60%, transparent);
  }
  .call-waiter-btn{
    flex:1; display:flex; align-items:center; justify-content:center; gap:8px;
    background: #E0B84C; color:#241a05; border:none; border-radius: 999px;
    padding: 14px 16px; font-family:'Inter', sans-serif; font-weight:700; font-size: 14.5px;
    box-shadow: 0 10px 30px rgba(224,184,76,.35);
  }
  .call-waiter-btn:disabled{ opacity:.6; }
  .call-bill-btn{
    flex:0 0 auto; display:flex; align-items:center; gap:6px;
    background: var(--panel); color: var(--cream); border:1px solid var(--gold);
    border-radius: 999px; padding: 14px 14px; font-family:'Inter', sans-serif; font-weight:700; font-size: 12px;
    white-space:nowrap;
  }

  .bill-overlay{
    position: fixed; inset:0; background: rgba(0,0,0,.55); z-index: 90;
    display:flex; align-items:center; justify-content:center; padding:20px;
    opacity:0; pointer-events:none; transition: opacity .25s ease;
  }
  .bill-overlay.open{ opacity:1; pointer-events:auto; }
  .bill-panel{
    width:100%; max-width: 480px; background:#fff; color:#1b1b1b;
    border-radius: 20px; max-height: 82vh; overflow-y:auto;
    transform: translateY(30px); transition: transform .25s ease;
  }
  .bill-overlay.open .bill-panel{ transform: translateY(0); }
  .bill-body{ padding: 24px 24px 8px; }
  .bill-body h2{ font-family:'Fraunces', serif; font-size:22px; margin:0 0 4px; text-align:center; }
  .bill-body .sub{ text-align:center; font-size:12px; color:#777; margin-bottom:16px; }
  .bill-line{ display:flex; justify-content:space-between; font-size:14px; padding:6px 0; border-bottom:1px dashed #ddd; }
  .bill-line .n{ flex:1; padding-right:10px; }
  .bill-total-row{ display:flex; justify-content:space-between; font-size:13px; padding:6px 0; color:#555; }
  .bill-total{ display:flex; justify-content:space-between; font-family:'Fraunces', serif; font-weight:700; font-size:19px; margin-top:8px; }
  .bill-actions{ display:flex; gap:10px; padding:16px 24px 24px; border-top:1px solid #eee; }
  .bill-actions button{ flex:1; padding:13px; border-radius:12px; border:none; font-weight:700; font-size:13.5px; }
  .bill-close{ background:#eee; color:#333; }
  .bill-request{ background: var(--gold); color:#1b1206; }

  .confirm-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.6); z-index:210; display:none; align-items:center; justify-content:center; padding:24px; }
  .confirm-overlay.open{ display:flex; }
  .confirm-box{ background:var(--panel); border:1px solid var(--line); border-radius:16px; padding:24px 22px; max-width:300px; width:100%; text-align:center; }
  .confirm-brand{ font-family:'Fraunces',serif; color:var(--gold); font-size:12px; font-weight:700; margin-bottom:12px; letter-spacing:.06em; text-transform:uppercase; }
  .confirm-question{ font-size:16px; font-weight:700; color:var(--cream); margin-bottom:6px; }
  .confirm-sub{ font-size:12.5px; color:var(--muted); margin-bottom:20px; line-height:1.4; display:none; }
  .confirm-actions{ display:flex; gap:10px; }
  .confirm-actions button{ flex:1; padding:11px; border-radius:10px; font-weight:700; font-size:13.5px; border:none; }
  .confirm-cancel{ background:var(--bg-deep); color:var(--cream); border:1px solid var(--line); }
  .confirm-ok{ background:var(--gold); color:var(--bg-deep); }
  .confirm-ok.danger{ background:#D9534F; color:#fff; }
  .bill-request:disabled{ opacity:.55; }
  .bill-empty{ text-align:center; color:#888; font-size:14px; padding: 30px 10px; }

  @media (min-width: 720px){
    header.top{ padding-left: calc(50% - 320px); padding-right: calc(50% - 320px); }
  }
</style>
</head>
<body>

<div id="updateBanner" style="display:none; position:sticky; top:0; z-index:150; background:var(--gold); color:var(--bg-deep); padding:9px 14px; align-items:center; justify-content:space-between; gap:10px; font-size:12.5px; font-weight:700;">
  <span id="updateBannerText">Доступна новая версия меню</span>
  <div style="display:flex; gap:8px; align-items:center;">
    <button id="updateBannerBtn" onclick="applyUpdate()" style="background:var(--bg-deep); color:var(--gold); border:none; padding:6px 12px; border-radius:8px; font-weight:700; font-size:12px;">Обновить</button>
    <button onclick="dismissUpdateBanner()" style="background:transparent; border:none; color:var(--bg-deep); font-size:16px; font-weight:700; padding:0 4px;">×</button>
  </div>
</div>

<header class="top">
  <div class="lang-switch-wrap">
    <div style="flex:1;"></div>
    <div style="position:relative;">
      <button class="lang-btn" onclick="toggleLangMenu()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15 15 0 0 1 0 20a15 15 0 0 1 0-20"/></svg>
        <span id="langLabel">RU</span>
      </button>
      <div class="lang-menu" id="langMenu">
        <button onclick="setLang('ru')" data-lang="ru">Русский</button>
        <button onclick="setLang('en')" data-lang="en">English</button>
        <button onclick="setLang('kk')" data-lang="kk">Қазақша</button>
      </div>
    </div>
    <div style="flex:1; display:flex; justify-content:flex-end;">
      <a class="review-link" href="https://2gis.kz/astana/firm/70000001101686055/tab/reviews" target="_blank" rel="noopener noreferrer">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
        <span id="reviewPromptText">Оставить отзыв</span>
      </a>
    </div>
  </div>

  <a href="/contact.html" class="credit-link">by RQ Coding<svg class="credit-icon" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M10 6H6a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-4"/><path d="M14 4h6v6"/><path d="M10 14L20 4"/></svg></a>
  <div class="brand-row">
    <div class="brand">
      <div class="brand-mark">GO</div>
      <div class="brand-text">
        <div class="name">GO pub</div>
        <div class="sub" id="taglineText">ЦИФРОВОЕ МЕНЮ</div>
      </div>
    </div>
    <div class="svc-note" id="svcNote">Обслуживание 10%. Цены указаны в тенге.</div>
  </div>

  <div class="mode-switch">
    <button id="btn-food" class="active" onclick="setMode('food')">Кухня</button>
    <button id="btn-bar" onclick="setMode('bar')">Бар</button>
  </div>

  <div class="search-wrap">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#8FA08D" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
    <input id="search" type="text" placeholder="Найти блюдо или напиток…" oninput="onSearch()">
  </div>

  <nav class="chips" id="chips"></nav>
</header>

<main id="main"></main>

<footer class="foot">
  <div class="gold">GO pub</div>
  <span id="enjoyText">Приятного аппетита!</span><br>
  <span id="scanNoteText">Отсканируйте QR‑код у столика, чтобы вернуться к меню в любой момент.</span>
</footer>

<div class="call-bar" id="callBar" style="display:none;">
  <button class="call-waiter-btn" id="callWaiterBtn" onclick="callWaiter()">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
    <span id="callWaiterLabel">Хочу сделать заказ</span>
  </button>
  <button class="call-bill-btn" id="callBillBtn" onclick="openBill()" style="display:none;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2h12a1 1 0 0 1 1 1v18l-3-2-3 2-3-2-3 2-3-2V3a1 1 0 0 1 1-1z"/><line x1="9" y1="7" x2="15" y2="7"/><line x1="9" y1="11" x2="15" y2="11"/></svg>
    <span id="callBillLabel">Предварительный чек</span>
  </button>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <div class="confirm-brand">GO pub</div>
    <div class="confirm-question" id="confirmQuestion"></div>
    <div class="confirm-sub" id="confirmSub"></div>
    <div class="confirm-actions">
      <button class="confirm-cancel" id="confirmCancelBtn" onclick="confirmNo()">Отмена</button>
      <button class="confirm-ok" id="confirmOkBtn" onclick="confirmYes()">Да</button>
    </div>
  </div>
</div>

<div class="bill-overlay" id="billOverlay">
  <div class="bill-panel">
    <div class="bill-body" id="billBody"></div>
    <div class="bill-actions">
      <button class="bill-close" onclick="closeBill()" id="billCloseText">Закрыть</button>
      <button class="bill-request" onclick="requestBillFromModal()" id="billRequestBtn">Попросить расчёт</button>
    </div>
    <div id="consentAsk" style="display:none; margin:0 24px 20px; padding:14px 16px; background:#f6f3ea; border-radius:12px; text-align:center;">
      <p id="consentText" style="margin:0 0 10px; font-size:12.5px; color:#555; line-height:1.4;">Нам запомнить ваши предпочтения?</p>
      <div style="display:flex; gap:8px;">
        <button id="consentNoBtn" onclick="answerConsent(false)" style="flex:1; padding:9px; border-radius:9px; border:1px solid #ccc; background:#fff; color:#333; font-weight:700; font-size:12.5px;">Нет, спасибо</button>

    <div id="forgetMeRow" style="display:none; text-align:center; margin:0 24px 20px;">
      <a href="#" id="forgetMeLinkText" onclick="forgetMe();return false;" style="font-size:11.5px; color:#999; text-decoration:underline;">Забыть меня на этом устройстве</a>
    </div>
  </div>
</div>

    forgetConfirmQuestion:"Forget you?", forgetConfirmSub:"Next time the waiter won't know your usual order.",
    billClose:"Close",
    updateBannerText:"A new menu version is available", updateBannerBtn:"Update",
    reviewPrompt:"Leave a review" },
  kk: { tagline:"ЦИФРЛЫҚ МӘЗІР", svc:"Қызмет көрсету ақысы 10%. Бағалар теңгемен.", kitchen:"Ас үй", bar:"Бар", search:"Тағам немесе сусын іздеу…", enjoy:"Ас болсын!", scanNote:"Кез келген уақытта мәзірге оралу үшін үстелдегі QR-кодты сканерлеңіз.", currency:" тг.", soldOut:"қазір жоқ",
    callWaiterBtn:"Тапсырыс бергім келеді", callWaiterWaiting:"Даяшы жолда…",
    billBtn:"Алдын ала чек", billTitle:"Алдын ала чек", billNotFiscal:"Фискалдық чек емес", billEmpty:"Әзірге тапсырыс берілген тағам жоқ",
    billSum:"Сома", billService:"Қызмет көрсету (10%)", billTotal:"Барлығы", tableWord:"Үстел",
    billRequestBtn:"Есеп сұрау", billRequestWaiting:"Даяшы есепті әкеле жатыр…",
    consentQuestion:"Сіздің қалауыңызды есте сақтайық па?", consentYes:"Иә, есте сақтау", consentNo:"Жоқ, рахмет",
    forgetMeLink:"Бұл құрылғыда мені ұмыту", forgottenAlert:"Дайын — деректер ұмытылды.",
    confirmBillQuestion:"Даяшыны есеппен шақыру керек пе?", confirmCancel:"Бас тарту", confirmYes:"Иә",
    forgetConfirmQuestion:"Сізді ұмыту керек пе?", forgetConfirmSub:"Келесі жолы даяшы сіздің әдеттегі тапсырысыңызды білмейді.",
    billClose:"Жабу",
    updateBannerText:"Мәзірдің жаңа нұсқасы қолжетімді", updateBannerBtn:"Жаңарту",
    reviewPrompt:"Пікір қалдыру" }
};

let currentMode = 'food';
let LANG = localStorage.getItem('gopub_lang') || 'ru';
let observer;
const WS_URL = "wss://go-pub-orders.kuatov-party.workers.dev/ws";
const QR_ID = new URLSearchParams(location.search).get('qr');
let TABLE = new URLSearchParams(location.search).get('table'); // may also arrive asynchronously via resolve_qr
let liveSocket = null;
let callCooldown = false;
let currentBill = null;
let tableUIActive = false;
const HARD_EXPIRE_MS = 12 * 60 * 60 * 1000;
const sessionStartedAt = Date.now();
let sessionExpired = false;
let pendingConfirmCallback = null;
const APP_VERSION = "8";
let updateDismissed = false;

function toggleLangMenu(){
  document.getElementById('langMenu').classList.toggle('open');
}
document.addEventListener('click', (e) => {
  const wrap = document.querySelector('.lang-switch-wrap');
  if(wrap && !wrap.contains(e.target)) document.getElementById('langMenu').classList.remove('open');
});

function setLang(lang){
  LANG = lang;
  localStorage.setItem('gopub_lang', lang);
  document.getElementById('langLabel').textContent = lang.toUpperCase();
  document.getElementById('htmlRoot').lang = lang;
  document.querySelectorAll('.lang-menu button').forEach(b => b.classList.toggle('active', b.dataset.lang===lang));
  document.getElementById('langMenu').classList.remove('open');
  applyStaticStrings();
  renderChips();
  renderMain();
}

function applyStaticStrings(){
  const s = STR[LANG];
  document.getElementById('taglineText').textContent = s.tagline;
  document.getElementById('svcNote').textContent = s.svc;
  document.getElementById('btn-food').textContent = s.kitchen;
  document.getElementById('btn-bar').textContent = s.bar;
  document.getElementById('search').placeholder = s.search;
  document.getElementById('enjoyText').textContent = s.enjoy;
  document.getElementById('scanNoteText').textContent = s.scanNote;
  document.getElementById('reviewPromptText').textContent = s.reviewPrompt;

  if(!callCooldown) document.getElementById('callWaiterLabel').textContent = s.callWaiterBtn;
  document.getElementById('callBillLabel').textContent = s.billBtn;
  document.getElementById('confirmCancelBtn').textContent = s.confirmCancel;
  document.getElementById('billCloseText').textContent = s.billClose;
  if(!document.getElementById('billRequestBtn').disabled) document.getElementById('billRequestBtn').textContent = s.billRequestBtn;
  document.getElementById('consentText').textContent = s.consentQuestion;
  document.getElementById('consentNoBtn').textContent = s.consentNo;
  document.getElementById('consentYesBtn').textContent = s.consentYes;
  document.getElementById('forgetMeLinkText').textContent = s.forgetMeLink;
  document.getElementById('updateBannerText').textContent = s.updateBannerText;
  document.getElementById('updateBannerBtn').textContent = s.updateBannerBtn;
  if(currentBill) renderBill();
}

function fmtPrice(item){
  let parts = [item.price];
  if(item.price2) parts.push(item.price2);
  if(item.price3) parts.push(item.price3);
  return parts.join(' / ') + STR[LANG].currency;
}

function renderChips(){
  const chips = document.getElementById('chips');
  chips.innerHTML = '';
  MENU[currentMode].forEach((cat, i) => {
    const b = document.createElement('button');
    b.textContent = cat.title[LANG] || cat.title.ru;
    b.dataset.idx = i;
    b.onclick = () => {
      const node = document.getElementById('cat-' + i);
      const header = document.querySelector('header.top');
      const headerHeight = header ? header.getBoundingClientRect().height : 0;
      const top = node.getBoundingClientRect().top + window.scrollY - headerHeight - 10;
      window.scrollTo({ top, behavior: 'smooth' });
    };
    chips.appendChild(b);
  });
}

function renderMain(){
  const main = document.getElementById('main');
  main.innerHTML = '';
  const cats = MENU[currentMode];
  const destKey = currentMode === 'food' ? 'kitchen' : 'bar';
  cats.forEach((cat, i) => {
    const sec = document.createElement('section');
    sec.className = 'category';
    sec.id = 'cat-' + i;

    let html = `<div class="cat-head"><h2>${cat.title[LANG] || cat.title.ru}</h2><div class="rule"></div></div>`;
    if(cat.note) html += `<p class="cat-note">${cat.note[LANG] || cat.note.ru}</p>`;
    cat.items.forEach(it => {
      const name = it.name[LANG] || it.name.ru;
      const desc = it.desc ? (it.desc[LANG] || it.desc.ru) : null;
      const searchBlob = [it.name.ru, it.name.en, it.name.kk, desc||''].join(' ').toLowerCase();
      const isUnavail = !!unavailable[destKey+'|'+it.name.ru];
      html += `<div class="item${isUnavail?' disabled':''}" data-search="${searchBlob}">
        <div class="item-row">
          ${it.n ? `<span class="item-num">${it.n}</span>` : ''}
          <span class="item-name">${name}</span>
          ${isUnavail ? `<span class="unavail-tag">${STR[LANG].soldOut}</span>` : ''}
          <span class="dots"></span>
          <span class="item-price">${fmtPrice(it)}</span>
        </div>
        ${desc ? `<div class="item-desc">${desc}</div>` : ''}
      </div>`;
    });
    sec.innerHTML = html;
    main.appendChild(sec);
  });
}

function setMode(mode){
  currentMode = mode;
  document.getElementById('btn-food').classList.toggle('active', mode==='food');
  document.getElementById('btn-bar').classList.toggle('active', mode==='bar');
  document.getElementById('search').value = '';
  renderChips();
  renderMain();
  window.scrollTo({top:0, behavior:'instant'});
  setupObserver();
}

function onSearch(){
  const q = document.getElementById('search').value.trim().toLowerCase();
  document.querySelectorAll('section.category').forEach(sec => {
    let visibleCount = 0;
    sec.querySelectorAll('.item').forEach(item => {
      const match = !q || item.dataset.search.includes(q);
      item.style.display = match ? '' : 'none';
      if(match) visibleCount++;
    });
    sec.style.display = visibleCount ? '' : 'none';
  });
}

function setupObserver(){
  if(observer) observer.disconnect();
  const chips = document.getElementById('chips').children;
  const header = document.querySelector('header.top');
  const headerHeight = header ? header.getBoundingClientRect().height : 190;
  observer = new IntersectionObserver((entries) => {
    entries.forEach(entry => {
      if(entry.isIntersecting){
        const idx = entry.target.id.split('-')[1];
        Array.from(chips).forEach(c => c.classList.remove('active'));
        if(chips[idx]){
          chips[idx].classList.add('active');
          chips[idx].scrollIntoView({behavior:'smooth', block:'nearest', inline:'center'});
        }
      }
    });
  }, { rootMargin: `-${Math.ceil(headerHeight+10)}px 0px -70% 0px` });
  document.querySelectorAll('section.category').forEach(sec => observer.observe(sec));
}

document.querySelectorAll('.lang-menu button').forEach(b => b.classList.toggle('active', b.dataset.lang===LANG));
document.getElementById('langLabel').textContent = LANG.toUpperCase();
document.getElementById('htmlRoot').lang = LANG;
applyStaticStrings();
renderChips();
renderMain();
setupObserver();

// --- live connection: pulls the shared menu + availability from the
// staff system, so a dish the kitchen/bar marks unavailable greys out
// here automatically, without editing this page. ---

function connectLive(){
  let socket;
  try{ socket = new WebSocket(WS_URL); }catch(e){ return; }
  liveSocket = socket;
  socket.onopen = () => {
    socket.send(JSON.stringify({type:"hello", role:"guest"}));
    if(TABLE) activateTableUI();
    else if(QR_ID) socket.send(JSON.stringify({type:"resolve_qr", qrId: QR_ID}));
  };
  socket.onmessage = (evt) => {
    let msg;
    try{ msg = JSON.parse(evt.data); }catch(e){ return; }
    if(msg.type === "state"){
      if(msg.menu){ MENU = { food: msg.menu.kitchen || [], bar: msg.menu.bar || [] }; }
      unavailable = msg.unavailable || {};
      renderChips();
      renderMain();
      onSearch();
      setupObserver();
    }
    if(msg.type === "qr_table" && msg.qrId === QR_ID){
      if(msg.table){ TABLE = msg.table; activateTableUI(); }
    }
    if(msg.type === "table_bill" && String(msg.table) === String(TABLE)){
      currentBill = msg;
      document.getElementById('callBillBtn').style.display = msg.hasOrders ? 'flex' : 'none';
      if(document.getElementById('billOverlay').classList.contains('open')) renderBill();
    }
  };
  socket.onclose = () => setTimeout(connectLive, 3000);
  socket.onerror = () => socket.close();
}
connectLive();

function pollBill(){
  if(!TABLE) return;
  if(liveSocket && liveSocket.readyState === WebSocket.OPEN){
    liveSocket.send(JSON.stringify({type:"get_table_bill", table: TABLE}));
  }
  setTimeout(pollBill, 15000);
}

function activateTableUI(){
  if(tableUIActive || sessionExpired) return;
  tableUIActive = true;
  document.getElementById('callBar').style.display = 'flex';
  document.body.style.paddingBottom = '128px';
  pollBill();
  announceReturningGuestIfConsented();
}

// --- if this tab stays open for 12 hours straight, the call button
// disappears for good — a fresh QR scan is needed to bring it back.
// This is what stops a long-abandoned tab from paging a waiter to an
// empty table. ---

function expireCallBar(){
  if(sessionExpired) return;
  sessionExpired = true;
  document.getElementById('callBar').style.display = 'none';
  document.body.style.paddingBottom = '';
}
setTimeout(expireCallBar, HARD_EXPIRE_MS);

document.addEventListener('visibilitychange', () => {
  if(!document.hidden && Date.now() - sessionStartedAt >= HARD_EXPIRE_MS) expireCallBar();
});

function callWaiter(){
  if(callCooldown || !TABLE || sessionExpired) return;
  if(liveSocket && liveSocket.readyState === WebSocket.OPEN){
    liveSocket.send(JSON.stringify({type:"call_waiter", table: TABLE}));
  }
  callCooldown = true;
  const btn = document.getElementById('callWaiterBtn');
  const label = document.getElementById('callWaiterLabel');
  btn.disabled = true;
  let seconds = 20;
  label.textContent = STR[LANG].callWaiterWaiting;
  const tick = setInterval(() => {
    seconds--;
    if(seconds <= 0){
      clearInterval(tick);
      callCooldown = false;
      btn.disabled = false;
      label.textContent = STR[LANG].callWaiterBtn;
    }
  }, 1000);
}

function openBill(){
  document.getElementById('billOverlay').classList.add('open');
  renderBill();
  if(liveSocket && liveSocket.readyState === WebSocket.OPEN){
    liveSocket.send(JSON.stringify({type:"get_table_bill", table: TABLE}));
  }
}
function closeBill(){
  document.getElementById('billOverlay').classList.remove('open');
}

function renderBill(){
  const body = document.getElementById('billBody');
  const s = STR[LANG];
  if(!currentBill || !currentBill.hasOrders){
    body.innerHTML = `<h2>${s.billTitle}</h2><div class="bill-empty">${s.billEmpty}</div>`;
    return;
  }
  let html = `<h2>${s.billTitle}</h2><div class="sub">GO pub · ${s.tableWord} ${TABLE}</div><div class="sub" style="margin-top:-10px;">${s.billNotFiscal}</div>`;
  currentBill.items.forEach(i => {
    const price = parseInt(String(i.price).replace(/[^\d]/g,''),10) || 0;
    html += `<div class="bill-line"><span class="n">${i.qty} × ${i.name}</span><span>${(price*i.qty).toLocaleString('ru-RU')}</span></div>`;
  });
  html += `<div class="bill-total-row"><span>${s.billSum}</span><span>${currentBill.subtotal.toLocaleString('ru-RU')} тг</span></div>
    <div class="bill-total-row"><span>${s.billService}</span><span>${currentBill.service.toLocaleString('ru-RU')} тг</span></div>
    <div class="bill-total"><span>${s.billTotal}</span><span>${currentBill.total.toLocaleString('ru-RU')} тг</span></div>`;
  body.innerHTML = html;
}

function requestBillFromModal(){
  if(!TABLE || sessionExpired) return;
  showConfirm(STR[LANG].confirmBillQuestion, null, () => {
    if(liveSocket && liveSocket.readyState === WebSocket.OPEN){
      liveSocket.send(JSON.stringify({type:"request_bill", table: TABLE}));
    }
    const btn = document.getElementById('billRequestBtn');
    btn.disabled = true;
    btn.textContent = STR[LANG].billRequestWaiting;
    setTimeout(() => { btn.disabled = false; btn.textContent = STR[LANG].billRequestBtn; }, 30000);

    const consent = localStorage.getItem('gopub_guest_consent');
    if(consent === null){
      document.getElementById('consentAsk').style.display = 'block';
    } else if(consent === 'yes'){
      sendSaveGuestOrder();
    }
  });
}

function getOrCreateDeviceId(){
  let id = localStorage.getItem('gopub_device_id');
  if(!id){
    id = (crypto.randomUUID ? crypto.randomUUID() : (Date.now()+'-'+Math.random()));
    localStorage.setItem('gopub_device_id', id);
  }
  return id;
}

function sendSaveGuestOrder(){
  if(!TABLE || !liveSocket || liveSocket.readyState !== WebSocket.OPEN) return;
  liveSocket.send(JSON.stringify({type:"save_guest_order", deviceId: getOrCreateDeviceId(), table: TABLE}));
}

function answerConsent(yes){
  document.getElementById('consentAsk').style.display = 'none';
  localStorage.setItem('gopub_guest_consent', yes ? 'yes' : 'no');
  if(yes){
    sendSaveGuestOrder();
    document.getElementById('forgetMeRow').style.display = 'block';
  }
}

function showConfirm(question, sub, onYes, danger){
  document.getElementById('confirmQuestion').textContent = question;
  const subEl = document.getElementById('confirmSub');
  if(sub){ subEl.textContent = sub; subEl.style.display = 'block'; }
  else { subEl.style.display = 'none'; }
  const okBtn = document.getElementById('confirmOkBtn');
  okBtn.className = 'confirm-ok' + (danger ? ' danger' : '');
  okBtn.textContent = STR[LANG].confirmYes;
  pendingConfirmCallback = onYes;
  document.getElementById('confirmOverlay').classList.add('open');
}
function confirmYes(){
  document.getElementById('confirmOverlay').classList.remove('open');
  const cb = pendingConfirmCallback;
  pendingConfirmCallback = null;
  if(cb) cb();
}
function confirmNo(){
  document.getElementById('confirmOverlay').classList.remove('open');
  pendingConfirmCallback = null;
}

function forgetMe(){
  showConfirm(STR[LANG].forgetConfirmQuestion, STR[LANG].forgetConfirmSub, () => {
    const deviceId = getOrCreateDeviceId();
    if(liveSocket && liveSocket.readyState === WebSocket.OPEN){
      liveSocket.send(JSON.stringify({type:"forget_guest", deviceId}));
    }
    localStorage.removeItem('gopub_guest_consent');
    localStorage.removeItem('gopub_device_id'); // rotate to a fresh, unlinked id
    document.getElementById('forgetMeRow').style.display = 'none';
    alert(STR[LANG].forgottenAlert);
  }, true);
}

// If this device already opted in on a previous visit, announce its
// presence at this table as soon as it's known, so the waiter can see
// "usual order" — brand-new / opted-out devices stay fully anonymous.
function announceReturningGuestIfConsented(){
  if(!TABLE) return;
  if(localStorage.getItem('gopub_guest_consent') === 'yes'){
    document.getElementById('forgetMeRow').style.display = 'block';
    if(liveSocket && liveSocket.readyState === WebSocket.OPEN){
      liveSocket.send(JSON.stringify({type:"guest_at_table", deviceId: getOrCreateDeviceId(), table: TABLE}));
    }
  }
}

function checkForUpdate(){
  if(updateDismissed) return;
  fetch(location.pathname, {cache:'no-store'})
    .then(r => r.text())
    .then(html => {
      const m = html.match(/const APP_VERSION = "([^"]+)"/);
      if(m && m[1] !== APP_VERSION){
        document.getElementById('updateBanner').style.display = 'flex';
      }
    })
    .catch(() => {});
}
function applyUpdate(){
  location.href = location.pathname + location.search + (location.search ? '&' : '?') + '_r=' + Date.now();
}
function dismissUpdateBanner(){
  updateDismissed = true;
  document.getElementById('updateBanner').style.display = 'none';
}
setTimeout(checkForUpdate, 5000);
setInterval(checkForUpdate, 5 * 60 * 1000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkForUpdate(); });
</script>
